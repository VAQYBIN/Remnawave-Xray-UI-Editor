# Сборка из исходников — берёт текущее рабочее дерево (`build: .`) и собирает
# образ `xray-ui-editor:local`, а не тянет `latest` из реестра. Пользователям
# нужен docker-compose.yml с готовым образом.
# Том другой, чем в docker-compose.yml (bind-mount ./data вместо именованного
# xray-editor-data): бэкапы конфигов и geo-базы между обычным и сборочным
# контейнером не общие.
services:
  remnawave-xray-ui-editor:
    build: .
    image: xray-ui-editor:local
    container_name: remnawave-xray-ui-editor
    hostname: remnawave-xray-ui-editor
    restart: unless-stopped
    ports:
      # Слева порт хоста (5065 — на 3000 обычно уже висит панель Remnawave),
      # справа порт внутри контейнера
      - "127.0.0.1:${PORT:-5065}:3000"
    env_file: .env
    environment:
      PORT: 3000
      DATA_DIR: /data
      STATIC_DIR: /app/frontend/dist
    volumes:
      # Здесь bind-mount намеренно: разработчику удобнее видеть бэкапы обычным
      # ls. На Linux каталог нужно подготовить один раз:
      #   mkdir -p data && sudo chown -R 1000:1000 data
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
