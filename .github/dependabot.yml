version: 2
updates:
  # npm workspaces: корневого package-lock.json достаточно, backend и frontend
  # подхватываются как workspaces.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Мажор @types/node описывает рантайм, которого у проекта нет: он держится
    # на Node 24 LTS. Обновляем вместе с базовым образом, а не раньше.
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    # Мелочь — одним PR, мажорные версии приходят по отдельности.
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  # Пины экшенов по SHA в .github/workflows обновляются здесь.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # Базовые образы Dockerfile (alpine, node). Версия Xray задана ARG'ами
  # вручную — её Dependabot не трогает.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Мажор базового образа — не автоматическая правка: node зашит ещё в
    # --target node24 у tsup и в node-version у CI, а прыгать на релиз до его
    # перехода в LTS проект не хочет. Обновляем осознанно, все места разом.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: alpine
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
