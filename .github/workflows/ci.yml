name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Публичный репозиторий: PR из форка запускает этот workflow, поэтому токен
# только на чтение и никаких секретов в джобах.
permissions:
  contents: read

# Новый пуш в ветку отменяет предыдущий прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: |
          npm run typecheck --workspace backend
          npm run typecheck --workspace frontend

      # Юниты обоих workspace: vitest бэкенда + vitest (jsdom) фронтенда.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # Playwright поднимает свой dev-сервер на 127.0.0.1:4173 и мокает API —
      # бэкенд и .env не нужны.
      - name: Run e2e
        run: npm run e2e --workspace frontend

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      # Полная история: секрет, добавленный и снесённый следующим коммитом,
      # остаётся в репозитории и должен находиться.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Официальный gitleaks-action лежит под коммерческой EULA, сам gitleaks —
      # под MIT. Ставим бинарь релиза с проверкой контрольной суммы, как ядро
      # Xray в Dockerfile; при смене версии двигать оба значения.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      # --redact обязателен: логи публичного репозитория читает кто угодно.
      - name: Scan history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner

      - name: .env и data/ не должны попадать под версионный контроль
        run: |
          tracked=$(git ls-files -- .env 'data/**')
          if [ -n "$tracked" ]; then
            echo "::error::Под версионным контролем оказались файлы с секретами:"
            echo "$tracked"
            exit 1
          fi
