name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Публичный репозиторий: PR из форка запускает этот workflow, поэтому токен
# только на чтение и никаких секретов в джобах.
permissions:
  contents: read

# Новый пуш в ветку отменяет предыдущий прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: |
          npm run typecheck --workspace backend
          npm run typecheck --workspace frontend

      # Юниты обоих workspace: vitest бэкенда + vitest (jsdom) фронтенда.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # Playwright поднимает свой dev-сервер на 127.0.0.1:4173 и мокает API —
      # бэкенд и .env не нужны.
      - name: Run e2e
        run: npm run e2e --workspace frontend

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
