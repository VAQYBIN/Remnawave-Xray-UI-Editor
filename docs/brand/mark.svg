<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Xray UI Editor">
  <title>Xray UI Editor</title>
  <!--
    Знак — сечение коммутационного гнезда (джека). Сигнал входит слева индиго
    (--flux), коммутируется в живом ядре и уходит вправо янтарём (--ember);
    стальные дуги корпуса разомкнуты ровно там, где проходит кабель.
    Тот же язык, что у графа: ingress → правило → egress.
  -->
  <defs>
    <linearGradient id="xue-core" x1="24" y1="32" x2="40" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6e7bff"/>
      <stop offset="1" stop-color="#f0a44a"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round">
    <path d="M55.18 25.79A24 24 0 0 0 8.82 25.79" stroke="#6b7789" stroke-width="3"/>
    <path d="M8.82 38.21A24 24 0 0 0 55.18 38.21" stroke="#6b7789" stroke-width="3"/>
    <path d="M2 32H25" stroke="#6e7bff" stroke-width="4"/>
    <path d="M39 32H62" stroke="#f0a44a" stroke-width="4"/>
  </g>
  <circle cx="32" cy="32" r="10" fill="url(#xue-core)"/>
</svg>
